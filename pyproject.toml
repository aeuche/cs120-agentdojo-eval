[project]
name = "cs120-agentdojo-eval"
version = "0.1.0"
description = "Controlled AgentDojo workspace evaluation of an email, calendar, and cloud-file agent."
requires-python = ">=3.12,<3.13"
dependencies = [
    "agentdojo[transformers]==0.1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["attacks", "defenses"]
